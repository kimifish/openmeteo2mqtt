update_interval_in_minutes: 15

forecast:
  update_interval_in_minutes: 60

mqtt:
  server: "mqtt.lan"
  port: 1883
  topic: "weather"
  connect_timeout_seconds: 10
  publish_timeout_seconds: 10
  reconnect_attempts: 3
  retry_delay_seconds: 5
  qos: 1
  retain: true

http:
  connect_timeout_seconds: 10
  read_timeout_seconds: 30
  retries: 4
  backoff_factor: 1

retry:
  initial_delay_seconds: 5
  max_delay_seconds: 180
  multiplier: 2
  jitter_seconds: 5

url: "https://api.open-meteo.com/v1/forecast"

params:
  latitude: 55.75
  longitude: 37.62
  timezone: "Europe/Moscow"
  forecast_days: 3

  current:
    - "temperature_2m"
    - "relative_humidity_2m"
    - "apparent_temperature"
    - "precipitation"
    - "rain"
    - "showers"
    - "snowfall"
    - "weather_code"
    - "cloud_cover"
    - "surface_pressure"
    - "wind_speed_10m"
    - "wind_direction_10m"

  hourly:
    - "temperature_2m"
    - "relative_humidity_2m"
    - "apparent_temperature"
    - "precipitation_probability"
    - "rain"
    - "snowfall"
    - "weather_code"
    - "cloud_cover"
    - "surface_pressure"
    - "wind_speed_10m"
    - "wind_direction_10m"

  daily:
    - "precipitation_probability_max"
    - "weather_code"
    - "temperature_2m_max"
    - "temperature_2m_min"
    - "wind_speed_10m_max"

weather_codes:
  0: "ясно"
  1: "малооблачно"
  2: "облачно"
  3: "сплошная облачность"
  45: "туман"
  48: "сильный туман"
  51: "небольшая морось"
  53: "морось"
  55: "сильная морось"
  56: "лёгкая ледяная морось"
  57: "ледяная морось"
  61: "лёгкий дождь"
  63: "дождь"
  65: "сильный дождь"
  66: "лёгкий ледяной дождь"
  67: "ледяной дождь"
  71: "лёгкий снег"
  73: "снег"
  75: "сильный снег"
  77: "снежные зёрна"
  80: "лёгкий ливень"
  81: "ливень"
  82: "сильный ливень"
  85: "снегопад"
  86: "сильный снегопад"
  95: "гроза"
  96: "град"
  99: "сильный град с грозой"
